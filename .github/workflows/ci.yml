name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q

      - name: Run DOC3040 validation (sample)
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python src/validation/run_validate_3040.py data/raw/doc3040_sample.csv

      - name: Run reconciliation 3040 vs 3050 (sample)
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          python src/reconciliation/reconcile_3040_3050.py data/raw/doc3040_sample.csv data/raw/doc3050_sample.csv

      - name: Upload outputs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-outputs
          path: outputs/
